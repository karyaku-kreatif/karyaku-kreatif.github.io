<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyaku Kreatif • Daftar Aplikasi</title>
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="unnamed.webp">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Background Glow Effects -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-blue-600/10 blur-[120px] pointer-events-none rounded-full"></div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-12 max-w-6xl flex-grow relative z-10">
        
        <!-- Header Section -->
        <header class="text-center mb-14">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight text-white">
                Daftar <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Aplikasi Kami</span>
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto text-sm md:text-base leading-relaxed">
                Berikut adalah daftar aplikasi yang kami kembangkan dan tersedia di Google Play Store.
            </p>
            <div class="mt-6 flex justify-center gap-4">
                <a href="https://play.google.com/store/apps/dev?id=7457413081606165342" target="_blank" 
                   class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-blue-600/25">
                    <i class="fa-brands fa-google-play"></i> Kunjungi Play Store
                </a>
            </div>
        </header>

        <!-- Search Bar Section -->
        <div class="max-w-md mx-auto mb-12">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Cari nama aplikasi..." 
                       class="w-full pl-11 pr-4 py-3.5 bg-slate-900/80 border border-slate-800 rounded-2xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-slate-500 text-sm shadow-inner transition backdrop-blur-md">
            </div>
        </div>

        <!-- App Grid -->
        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full text-center text-slate-500 py-16">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
                <p>Memuat daftar aplikasi...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-900/80 py-8 text-center text-slate-500 text-xs relative z-10 space-y-3">
        <div>
            <a href="https://karyaku-kreatif.github.io/privacy-policy/" class="text-slate-400 hover:text-blue-400 transition underline font-medium">Privacy Policy</a>
        </div>
        <p>&copy; <span id="year"></span> Karyaku Kreatif. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let appsData = [];

        async function loadApps() {
            try {
                const response = await fetch('apps.json');
                appsData = await response.json();
                displayApps(appsData);
            } catch (error) {
                console.error('Gagal memuat data aplikasi:', error);
                document.getElementById('appGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-400 py-12 bg-red-950/20 border border-red-900/30 rounded-2xl">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>Gagal memuat daftar aplikasi. Pastikan file apps.json tersedia.</p>
                    </div>`;
            }
        }

        function displayApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center text-slate-500 py-16 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
                        <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-600"></i>
                        <p>Tidak ada aplikasi yang ditemukan.</p>
                    </div>`;
                return;
            }

            apps.forEach(app => {
                const card = `
                    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 flex flex-col justify-between hover:border-blue-500/50 hover:bg-slate-900 transition-all duration-300 shadow-xl group backdrop-blur-sm">
                        <div>
                            <div class="flex items-start space-x-4 mb-4">
                                <img src="${app.icon}" alt="${app.title}" class="w-16 h-16 rounded-2xl object-cover shadow-md group-hover:scale-105 transition duration-300 flex-shrink-0 bg-slate-800">
                                <div class="min-w-0 flex-1">
                                    <h2 class="font-bold text-base text-white truncate group-hover:text-blue-400 transition">${app.title}</h2>
                                    <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                        <span class="inline-flex items-center gap-1 text-xs font-medium text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-md">
                                            <i class="fa-solid fa-star text-[10px]"></i> ${app.scoreText || 'N/A'}
                                        </span>
                                        <span class="text-xs text-slate-400 truncate">${app.installs || ''}</span>
                                    </div>
                                </div>
                            </div>
                            <p class="text-xs text-slate-400 line-clamp-3 mb-6 leading-relaxed">${app.summary || 'Tidak ada deskripsi tersedia.'}</p>
                        </div>
                        <a href="${app.url}" target="_blank" 
                           class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-blue-600/10 hover:bg-blue-600 text-blue-400 hover:text-white text-xs font-semibold rounded-xl border border-blue-500/20 hover:border-transparent transition-all duration-300 shadow-sm">
                            <i class="fa-brands fa-google-play"></i> Install Aplikasi
                        </a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = appsData.filter(app => app.title.toLowerCase().includes(keyword));
            displayApps(filtered);
        });

        loadApps();
    </script>
</body>
</html>
