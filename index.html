<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Aplikasi Resmi</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div class="container mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
                Koleksi Aplikasi Kami
            </h1>
            <p class="text-gray-400 max-w-lg mx-auto">
                Daftar lengkap aplikasi resmi yang kami kembangkan dan tersedia di Google Play Store.
            </p>
            <a href="https://play.google.com/store/apps/dev?id=7457413081606165342" target="_blank" 
               class="inline-block mt-5 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-full transition shadow-lg">
                Kunjungi Developer Page
            </a>
        </header>

        <!-- Search Bar -->
        <div class="max-w-md mx-auto mb-10">
            <input type="text" id="searchInput" placeholder="Cari aplikasi..." 
                   class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 shadow-inner">
        </div>

        <!-- App Grid -->
        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Data aplikasi akan dimuat secara otomatis di sini -->
            <div class="col-span-full text-center text-gray-500 py-10">Memuat aplikasi...</div>
        </div>
    </div>

    <!-- Script JavaScript untuk memuat & memfilter data -->
    <script>
        let appsData = [];

        async function loadApps() {
            try {
                const response = await fetch('apps.json');
                appsData = await response.json();
                displayApps(appsData);
            } catch (error) {
                console.error('Gagal memuat data aplikasi:', error);
                document.getElementById('appGrid').innerHTML = `
                    <p class="col-span-full text-center text-red-400">
                        Gagal memuat daftar aplikasi. Pastikan file apps.json sudah tersedia.
                    </p>`;
            }
        }

        function displayApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            
            if (apps.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500">Tidak ada aplikasi ditemukan.</p>';
                return;
            }

            apps.forEach(app => {
                const card = `
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col justify-between hover:border-blue-500 transition shadow-md group">
                        <div>
                            <div class="flex items-center space-x-4 mb-4">
                                <img src="${app.icon}" alt="${app.title}" class="w-16 h-16 rounded-xl object-cover shadow group-hover:scale-105 transition">
                                <div>
                                    <h2 class="font-bold text-lg text-white line-clamp-1">${app.title}</h2>
                                    <p class="text-xs text-gray-400 mt-1">⭐ ${app.scoreText || 'N/A'} • ${app.installs || ''}</p>
                                </div>
                            </div>
                            <p class="text-sm text-gray-300 line-clamp-2 mb-4">${app.summary || ''}</p>
                        </div>
                        <a href="${app.url}" target="_blank" 
                           class="w-full text-center py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition shadow">
                            Install di Play Store
                        </a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = appsData.filter(app => app.title.toLowerCase().includes(keyword));
            displayApps(filtered);
        });

        loadApps();
    </script>
</body>
</html>
