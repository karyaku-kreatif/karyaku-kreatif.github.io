<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyaku Kreatif • Daftar Aplikasi</title>
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="unnamed.webp">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mesh-gradient {
            background-image: 
                radial-gradient(at 10% 20%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(245, 158, 11, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }
        /* Panel widget (kalender & cuaca) */
        .wg-panel { transition: opacity .2s ease, transform .2s ease; }
        .wg-right { transform-origin: top right; }
        .wg-left { transform-origin: top left; }
        .wg-panel.wg-hidden { opacity: 0; transform: scale(.92) translateY(-10px); pointer-events: none; visibility: hidden; }
        @media (prefers-reduced-motion: reduce) { .wg-panel { transition: none; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col mesh-gradient selection:bg-blue-500 selection:text-white">

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-16 max-w-6xl flex-grow relative z-10">
        
        <!-- Header Section -->
        <header class="text-center mb-14">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4 tracking-tight text-white">
                Daftar <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-amber-400">Aplikasi Kami</span>
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto text-sm md:text-base leading-relaxed">
                Jelajahi berbagai aplikasi menarik yang kami kembangkan untuk Anda di Google Play Store.
            </p>
            <div class="mt-8 flex flex-wrap justify-center items-start gap-x-5 gap-y-4">
                <!-- Google Play (aktif) -->
                <a href="https://play.google.com/store/apps/dev?id=7457413081606165342" target="_blank" rel="noopener"
                   aria-label="Get it on Google Play" title="Buka Play Store Developer"
                   class="inline-block transition-all duration-300 hover:scale-105">
                    <img src="google-play-badge.png" alt="Get it on Google Play" class="h-14 w-auto">
                </a>

                <!-- Huawei AppGallery (segera) -->
                <div class="flex flex-col items-center gap-1.5" title="Segera hadir di Huawei AppGallery">
                    <img src="appgallery-badge.png" alt="Explore it on Huawei AppGallery" class="h-14 w-auto opacity-50 grayscale select-none" draggable="false">
                    <span class="text-[10px] font-semibold uppercase tracking-wider text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2.5 py-0.5 rounded-full">Coming Soon</span>
                </div>

                <!-- Samsung Galaxy Store (segera) -->
                <div class="flex flex-col items-center gap-1.5" title="Segera hadir di Galaxy Store">
                    <img src="galaxy-store-badge.png" alt="Available on Galaxy Store" class="h-14 w-auto opacity-50 grayscale select-none" draggable="false">
                    <span class="text-[10px] font-semibold uppercase tracking-wider text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2.5 py-0.5 rounded-full">Coming Soon</span>
                </div>
            </div>
        </header>

        <!-- Search Bar Section -->
        <div class="max-w-md mx-auto mb-14">
            <div class="relative group">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-blue-400 transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Cari nama aplikasi..." 
                       class="w-full pl-11 pr-4 py-4 bg-slate-900/60 border border-slate-800/80 rounded-2xl focus:outline-none focus:border-blue-500/80 focus:ring-2 focus:ring-blue-500/20 text-white placeholder-slate-500 text-sm shadow-xl transition backdrop-blur-xl">
            </div>
        </div>

        <!-- App Grid -->
        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full text-center text-slate-500 py-16">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                <p class="text-sm">Memuat daftar aplikasi...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 backdrop-blur-md py-8 text-center text-slate-400 text-xs relative z-10">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; <span id="year"></span> Karyaku Kreatif. All rights reserved.</p>
            <div class="flex items-center gap-6">
                <a href="https://karyaku-kreatif.github.io/privacy-policy/" class="hover:text-blue-400 transition font-medium">Privacy Policy</a>
                <a href="mailto:karyakukreatif@gmail.com" class="hover:text-blue-400 transition font-medium"><i class="fa-solid fa-envelope mr-1"></i> Bantuan & Kontak</a>
            </div>
        </div>
    </footer>

    <!-- ===== Widget Cuaca (kiri atas) ===== -->
    <button id="cuacaBtn" type="button" aria-expanded="false" aria-controls="cuacaBox"
        class="fixed top-5 left-5 z-50 flex items-center gap-2 px-5 py-3 rounded-full bg-gradient-to-r from-sky-600 to-blue-600 hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 text-white text-sm font-semibold shadow-lg shadow-sky-600/30 transition">
        <span id="cuacaIcon" aria-hidden="true">🌤️</span>
        <span id="cuacaLabel">Cuaca</span>
    </button>

    <div id="cuacaBox" role="dialog" aria-label="Cuaca"
        class="wg-panel wg-left wg-hidden fixed top-20 left-5 z-50 w-[calc(100%-2.5rem)] sm:w-[360px] h-[min(580px,calc(100vh-6rem))] rounded-2xl overflow-hidden border border-slate-700 shadow-2xl shadow-black/50 bg-slate-950">
        <iframe id="cuacaFrame" data-src="https://karyaku-kreatif.github.io/cuaca/"
            allow="geolocation" class="w-full h-full border-0" title="Cuaca"></iframe>
    </div>

    <!-- ===== Widget Kalender Melayang (kanan atas) ===== -->
    <button id="kalBtn" type="button" aria-expanded="false" aria-controls="kalBox"
        class="fixed top-5 right-5 z-50 flex items-center gap-2 px-5 py-3 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-300 text-white text-sm font-semibold shadow-lg shadow-blue-600/30 transition">
        <i id="kalIcon" class="fa-regular fa-clock"></i>
        <span id="kalLabel" class="tabular-nums">Kalender</span>
    </button>

    <div id="kalBox" role="dialog" aria-label="Kalender"
        class="wg-panel wg-right wg-hidden fixed top-20 right-5 z-50 w-[calc(100%-2.5rem)] sm:w-[380px] h-[min(520px,calc(100vh-6rem))] rounded-2xl overflow-hidden border border-slate-700 shadow-2xl shadow-black/50 bg-slate-900">
        <iframe id="kalFrame" data-src="https://karyaku-kreatif.github.io/kalender/"
            class="w-full h-full border-0" title="Kalender"></iframe>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let appsData = [];

        async function loadApps() {
            try {
                // ?t=... supaya browser tidak memakai cache lama
                const response = await fetch('apps.json?t=' + Date.now());
                appsData = await response.json();
                displayApps(appsData);
            } catch (error) {
                console.error('Gagal memuat data aplikasi:', error);
                document.getElementById('appGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-400 py-12 bg-red-950/20 border border-red-900/30 rounded-2xl">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p class="text-sm">Gagal memuat daftar aplikasi. Pastikan file apps.json tersedia.</p>
                    </div>`;
            }
        }

        function displayApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center text-slate-500 py-16 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
                        <i class="fa-regular fa-folder-open text-3xl mb-3 text-slate-600"></i>
                        <p class="text-sm">Tidak ada aplikasi yang ditemukan.</p>
                    </div>`;
                return;
            }

            apps.forEach(app => {
                const card = `
                    <div class="bg-gradient-to-b from-slate-900/80 to-slate-900/40 border border-slate-800/80 rounded-3xl p-6 hover:border-blue-500/40 hover:shadow-2xl hover:shadow-blue-500/10 transition-all duration-300 group backdrop-blur-xl">
                        <div class="flex items-start space-x-4 mb-4">
                            <img src="${app.icon}" alt="${app.title}" class="w-16 h-16 rounded-2xl object-cover shadow-lg group-hover:scale-105 transition duration-300 flex-shrink-0 bg-slate-800 border border-slate-700/50">
                            <div class="min-w-0 flex-1">
                                <h2 class="font-bold text-base text-white truncate group-hover:text-blue-400 transition">${app.title}</h2>
                                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                    <span class="inline-flex items-center gap-1 text-xs font-semibold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2.5 py-0.5 rounded-lg">
                                        <i class="fa-solid fa-star text-[10px]"></i> ${app.scoreText || 'N/A'}
                                    </span>
                                    <span class="text-xs text-slate-400 truncate">${app.installs || ''}</span>
                                </div>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">${app.summary || 'Tidak ada deskripsi tersedia.'}</p>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = appsData.filter(app => app.title.toLowerCase().includes(keyword));
            displayApps(filtered);
        });

        loadApps();

        /* ===== Widget Cuaca & Kalender ===== */
        (function () {
            const $ = (id) => document.getElementById(id);
            const kal = { btn: $('kalBtn'), box: $('kalBox'), frame: $('kalFrame'), icon: $('kalIcon'), label: $('kalLabel') };
            const cua = { btn: $('cuacaBtn'), box: $('cuacaBox'), frame: $('cuacaFrame'), icon: $('cuacaIcon'), label: $('cuacaLabel') };
            let cuacaInfo = { emoji: '🌤️', text: 'Cuaca' };
            let jamAktif = false;

            const isOpen = (w) => !w.box.classList.contains('wg-hidden');

            function jamSekarang() {
                const d = new Date();
                const p = (n) => String(n).padStart(2, '0');
                return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
            }

            function render() {
                const ko = isOpen(kal);
                kal.icon.className = ko ? 'fa-solid fa-xmark' : 'fa-regular fa-clock';
                kal.label.textContent = ko ? 'Tutup' : (jamAktif ? jamSekarang() : 'Kalender');
                kal.btn.setAttribute('aria-expanded', ko);

                const co = isOpen(cua);
                cua.icon.textContent = co ? '✕' : cuacaInfo.emoji;
                cua.label.textContent = co ? 'Tutup' : cuacaInfo.text;
                cua.btn.setAttribute('aria-expanded', co);
            }

            function setOpen(w, open) {
                // Iframe kalender baru dimuat saat pertama kali dibuka
                if (open && !w.frame.src) w.frame.src = w.frame.dataset.src;
                w.box.classList.toggle('wg-hidden', !open);
                if (open) (w === kal ? cua : kal).box.classList.add('wg-hidden'); // satu panel saja yang terbuka
                render();
            }

            // Perbarui jam di tombol kalender tiap detik
            // Awalnya tertulis "Kalender", setelah halaman selesai dimuat berganti jadi jam
            window.addEventListener('load', () => { jamAktif = true; render(); });
            setInterval(() => { if (jamAktif) render(); }, 1000);

            kal.btn.addEventListener('click', () => setOpen(kal, !isOpen(kal)));
            cua.btn.addEventListener('click', () => setOpen(cua, !isOpen(cua)));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { setOpen(kal, false); setOpen(cua, false); }
            });

            // Terima ringkasan cuaca dari iframe untuk label tombol (mis. "🌤️ 31°C")
            window.addEventListener('message', (e) => {
                if (e.source !== cua.frame.contentWindow) return;
                const d = e.data;
                if (!d || d.type !== 'cuaca' || typeof d.temp !== 'number') return;
                cuacaInfo = { emoji: String(d.emoji || '🌤️').slice(0, 4), text: Math.round(d.temp) + '°C' };
                render();
            });

            // Cuaca dimuat otomatis setelah halaman selesai, supaya tombol langsung menampilkan suhu
            window.addEventListener('load', () => { cua.frame.src = cua.frame.dataset.src; });
        })();
    </script>
</body>
</html>
